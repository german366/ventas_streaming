[project]
name = "ventas-streaming"
version = "1.0.0"
description = "Pipeline de streaming end-to-end de ventas POS con Apache Kafka, Apache Beam y Flink"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apache-beam==2.74.0",
  "confluent-kafka>=2.8,<3",
  "pip>=25,<27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ventas_streaming"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requiere el stack de Docker Compose"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
